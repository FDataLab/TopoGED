name: gclstm_env
channels:
  - pytorch
  - nvidia
  - pyg
  - conda-forge
dependencies:
  - python=3.9
  - pytorch=2.1.0
  - torchvision
  - torchaudio
  - pytorch-cuda=12.1  # Change to your CUDA version (e.g., 11.8)
  - pyg  # Installs torch-geometric
  - networkx
  - scikit-learn
  - numpy
  - pip
  - pip:
      - torch-scatter
      - torch-sparse
      - torch-cluster
      - torch-spline-conv