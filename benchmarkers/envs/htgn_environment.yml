name: htgn_env
channels:
  - pytorch
  - nvidia
  - conda-forge
dependencies:
  - python=3.9
  - pytorch=2.1.0
  - nvidia::cuda-toolkit=12.1
  - pyg
  - networkx
  - scikit-learn
  - numpy
  - pip
  - pip:
      - geoopt  # Critical for RiemannianAdam
      - torch-geometric-temporal
      - hypll     # Optional: Hyperbolic Deep Learning library